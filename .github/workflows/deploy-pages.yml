# 静心 Jingxin — GitHub Pages 部署流水线
# push 到 master 且 lib/web/pubspec 有改动时：analyze → test → build web → deploy-pages
# 说明：analyze+test+build 已覆盖常规 CI 校验，故不再单独建 ci.yml。
# 首次启用：仓库 Settings → Pages → Source 选 "GitHub Actions"。

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (block on errors only)
        run: flutter analyze --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build web (base-href /Jingxin/)
        run: flutter build web --release --base-href /Jingxin/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
